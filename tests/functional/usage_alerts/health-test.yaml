sarc:
  health_monitor:
    checks:
      # Database disk check examples
      db_size_check_0:
        $class: "sarc.alerts.usage_alerts.disk_space:DatabaseSizeCheck"
        active: true
        limit: 0
      db_size_check_10k:
        $class: "sarc.alerts.usage_alerts.disk_space:DatabaseSizeCheck"
        active: true
        limit: 10_000
      db_size_check_20m:
        $class: "sarc.alerts.usage_alerts.disk_space:DatabaseSizeCheck"
        active: true
        limit: 20_000_000

      # Cache disk check examples
      cache_size_check_0:
        $class: "sarc.alerts.usage_alerts.disk_space:CacheSizeCheck"
        active: true
        limit: 0
      cache_size_check_10k:
        $class: "sarc.alerts.usage_alerts.disk_space:CacheSizeCheck"
        active: true
        limit: 10_000
      cache_size_check_1m:
        $class: "sarc.alerts.usage_alerts.disk_space:CacheSizeCheck"
        active: true
        limit: 1_000_000

      # cluster_response_* checks correspond to test params in test_alert_cluster_response.py
      cluster_response_default:
        $class: "sarc.alerts.usage_alerts.cluster_response:ClusterResponseCheck"
        active: true
      cluster_response_365_days:
        $class: "sarc.alerts.usage_alerts.cluster_response:ClusterResponseCheck"
        active: true
        time_interval: 365d
      cluster_response_283_days:
        $class: "sarc.alerts.usage_alerts.cluster_response:ClusterResponseCheck"
        active: true
        time_interval: 283d
      cluster_response_282_days:
        $class: "sarc.alerts.usage_alerts.cluster_response:ClusterResponseCheck"
        active: true
        time_interval: 282d
      cluster_response_281_days:
        $class: "sarc.alerts.usage_alerts.cluster_response:ClusterResponseCheck"
        active: true
        time_interval: 281d
      cluster_response_280_days:
        $class: "sarc.alerts.usage_alerts.cluster_response:ClusterResponseCheck"
        active: true
        time_interval: 280d
      cluster_response_279_days:
        $class: "sarc.alerts.usage_alerts.cluster_response:ClusterResponseCheck"
        active: true
        time_interval: 279d
      cluster_response_filtered_cluster_names:
        $class: "sarc.alerts.usage_alerts.cluster_response:ClusterResponseCheck"
        active: true
        cluster_names: ["fromage", "patate"]

      # node_gpu_usage_* checks correspond to test params in test_alert_gpu_usage.py
      node_gpu_usage_0:
        $class: "sarc.alerts.usage_alerts.gpu_usage:NodeGpuUsageCheck"
        active: true
        gpu_type: "A100"
        time_interval: null
        minimum_runtime: null
      node_gpu_usage_1:
        $class: "sarc.alerts.usage_alerts.gpu_usage:NodeGpuUsageCheck"
        active: true
        gpu_type: "A100"
        time_interval: null
        minimum_runtime: 43200s
      node_gpu_usage_2:
        $class: "sarc.alerts.usage_alerts.gpu_usage:NodeGpuUsageCheck"
        active: true
        gpu_type: "A100"
        time_interval: null
        minimum_runtime: 43201s
      node_gpu_usage_3:
        $class: "sarc.alerts.usage_alerts.gpu_usage:NodeGpuUsageCheck"
        active: true
        gpu_type: "A100"
        time_interval: null
        minimum_runtime: null
        threshold: 0.05
      node_gpu_usage_4:
        $class: "sarc.alerts.usage_alerts.gpu_usage:NodeGpuUsageCheck"
        active: true
        gpu_type: "A100"
        time_interval: null
        minimum_runtime: null
        threshold: 0
      node_gpu_usage_5:
        $class: "sarc.alerts.usage_alerts.gpu_usage:NodeGpuUsageCheck"
        active: true
        gpu_type: "A100"
        time_interval: null
        minimum_runtime: null
        threshold: 0.1
        min_tasks: 2
      node_gpu_usage_6:
        $class: "sarc.alerts.usage_alerts.gpu_usage:NodeGpuUsageCheck"
        active: true
        gpu_type: "A100"
      node_gpu_usage_7:
        $class: "sarc.alerts.usage_alerts.gpu_usage:NodeGpuUsageCheck"
        active: true
        gpu_type: "unknown"
        time_interval: null
      node_gpu_usage_8:
        $class: "sarc.alerts.usage_alerts.gpu_usage:NodeGpuUsageCheck"
        active: true
        gpu_type: "A100"
        time_interval: null
        minimum_runtime: 43200s
      node_gpu_usage_9:
        $class: "sarc.alerts.usage_alerts.gpu_usage:NodeGpuUsageCheck"
        active: true
        gpu_type: "A100"
        time_interval: 1h

      # gpu_util_per_user_* checks correspond to test params in test_alert_gpu_util_per_user.py
      gpu_util_per_user_0:
        $class: "sarc.alerts.usage_alerts.gpu_util_per_user:GpuUtilPerUserCheck"
        active: true
        threshold: 0s
      gpu_util_per_user_1:
        $class: "sarc.alerts.usage_alerts.gpu_util_per_user:GpuUtilPerUserCheck"
        active: true
        threshold: 7h
        time_interval: null
      gpu_util_per_user_2:
        $class: "sarc.alerts.usage_alerts.gpu_util_per_user:GpuUtilPerUserCheck"
        active: true
        threshold: 6h
        time_interval: null
      gpu_util_per_user_3:
        $class: "sarc.alerts.usage_alerts.gpu_util_per_user:GpuUtilPerUserCheck"
        active: true
        threshold: 8h
        time_interval: 276d
      gpu_util_per_user_4:
        $class: "sarc.alerts.usage_alerts.gpu_util_per_user:GpuUtilPerUserCheck"
        active: true
        threshold: 8h
        time_interval: 276d
        minimum_runtime: 39000s

      # prometheus_gpu_type_* checks correspond to test params in test_prometheus_gpu_types.py
      prometheus_gpu_type_hyrule:
        $class: "sarc.alerts.usage_alerts.prometheus_gpu_types:PrometheusGpuTypeCheck"
        active: true
        cluster_name: hyrule
      prometheus_gpu_type_gerudo:
        $class: "sarc.alerts.usage_alerts.prometheus_gpu_types:PrometheusGpuTypeCheck"
        active: true
        cluster_name: gerudo
      prometheus_gpu_type_patate:
        $class: "sarc.alerts.usage_alerts.prometheus_gpu_types:PrometheusGpuTypeCheck"
        active: true
        cluster_name: patate
      prometheus_gpu_type_fromage:
        $class: "sarc.alerts.usage_alerts.prometheus_gpu_types:PrometheusGpuTypeCheck"
        active: true
        cluster_name: fromage
      prometheus_gpu_type_raisin:
        $class: "sarc.alerts.usage_alerts.prometheus_gpu_types:PrometheusGpuTypeCheck"
        active: true
        cluster_name: raisin
      prometheus_gpu_type_all:
        $class: "sarc.alerts.usage_alerts.prometheus_gpu_types:PrometheusGpuTypeCheck"
        active: true
        cluster_name: null

      # prometheus_stats_coverage_* checks correspond to test params in test_prometheus_stats_coverage.py
      #
      # Fetch attempts seeded by the test inside the default 1-day window (SEED in the test file):
      #   raisin  14 attempts, 5 with stats (35.7 %)
      #   mila     1 attempt,  1 with stats (100 %)
      #   patate   1 attempt,  1 with stats (100 %)
      #   fromage  1 attempt,  0 with stats (0 %)
      # raisin has 5 more attempts, all with stats, 8 days before the window.
      #
      # gerudo and hyrule have a prometheus_url too, so the checks that don't name their
      # clusters expect them -- but the job factory creates no job for them, hence no
      # attempt either, hence one "no Prometheus fetch attempt" alert each.

      # Every cluster checked: raisin (35.7 %) and fromage (0 %) are below 50 %.
      prometheus_stats_coverage_default:
        $class: "sarc.alerts.usage_alerts.prometheus_stats_coverage:PrometheusStatsCoverageCheck"
        active: true

      # Threshold below raisin's coverage: only fromage is left.
      prometheus_stats_coverage_coverage_030:
        $class: "sarc.alerts.usage_alerts.prometheus_stats_coverage:PrometheusStatsCoverageCheck"
        active: true
        min_coverage: 0.3

      # No coverage threshold: only the clusters without any attempt are left.
      prometheus_stats_coverage_coverage_0:
        $class: "sarc.alerts.usage_alerts.prometheus_stats_coverage:PrometheusStatsCoverageCheck"
        active: true
        min_coverage: 0.0

      # Restricted to raisin alone, for the tests that need a check that can succeed.
      prometheus_stats_coverage_raisin:
        $class: "sarc.alerts.usage_alerts.prometheus_stats_coverage:PrometheusStatsCoverageCheck"
        active: true
        cluster_names:
          - raisin

      # Restricted to some clusters, one of which has no attempt at all.
      prometheus_stats_coverage_clusters:
        $class: "sarc.alerts.usage_alerts.prometheus_stats_coverage:PrometheusStatsCoverageCheck"
        active: true
        cluster_names:
          - raisin
          - mila
          - invisible-cluster

      # Wide enough window to also include raisin's older attempts, which lift it to 52.6 %.
      prometheus_stats_coverage_interval_30d:
        $class: "sarc.alerts.usage_alerts.prometheus_stats_coverage:PrometheusStatsCoverageCheck"
        active: true
        time_interval: 30d

      # Window too narrow to hold any attempt: every expected cluster is reported.
      prometheus_stats_coverage_interval_1s:
        $class: "sarc.alerts.usage_alerts.prometheus_stats_coverage:PrometheusStatsCoverageCheck"
        active: true
        time_interval: 1s

      # Out-of-range threshold: rejected before any query.
      prometheus_stats_coverage_invalid_coverage:
        $class: "sarc.alerts.usage_alerts.prometheus_stats_coverage:PrometheusStatsCoverageCheck"
        active: true
        min_coverage: 1.5

      # Empty window: rejected before any query.
      prometheus_stats_coverage_invalid_interval:
        $class: "sarc.alerts.usage_alerts.prometheus_stats_coverage:PrometheusStatsCoverageCheck"
        active: true
        time_interval: 0s

      # zero_sm_occupancy_power_* checks correspond to test params in
      # test_zero_sm_occupancy_power.py (SEED in the test file).
      #
      # Anomalies seeded on raisin: one submitted 2h before MOCK_TIME (250 W),
      # one submitted 8 days before MOCK_TIME (350 W); fromage has one submitted
      # 2h before MOCK_TIME at exactly 100 W.
      zero_sm_occupancy_power_default:
        $class: "sarc.alerts.usage_alerts.zero_sm_occupancy_power:ZeroSmOccupancyPowerCheck"
        active: true
      zero_sm_occupancy_power_all:
        $class: "sarc.alerts.usage_alerts.zero_sm_occupancy_power:ZeroSmOccupancyPowerCheck"
        active: true
        time_interval: null
      zero_sm_occupancy_power_threshold_300:
        $class: "sarc.alerts.usage_alerts.zero_sm_occupancy_power:ZeroSmOccupancyPowerCheck"
        active: true
        time_interval: null
        min_power_watts: 300
      zero_sm_occupancy_power_threshold_300_recent:
        $class: "sarc.alerts.usage_alerts.zero_sm_occupancy_power:ZeroSmOccupancyPowerCheck"
        active: true
        min_power_watts: 300
      zero_sm_occupancy_power_clusters:
        $class: "sarc.alerts.usage_alerts.zero_sm_occupancy_power:ZeroSmOccupancyPowerCheck"
        active: true
        time_interval: null
        cluster_names:
          - raisin
          - invisible-cluster
      zero_sm_occupancy_power_report_limit_1:
        $class: "sarc.alerts.usage_alerts.zero_sm_occupancy_power:ZeroSmOccupancyPowerCheck"
        active: true
        time_interval: null
        report_limit: 1
      zero_sm_occupancy_power_invalid_interval:
        $class: "sarc.alerts.usage_alerts.zero_sm_occupancy_power:ZeroSmOccupancyPowerCheck"
        active: true
        time_interval: 0s
      zero_sm_occupancy_power_invalid_threshold:
        $class: "sarc.alerts.usage_alerts.zero_sm_occupancy_power:ZeroSmOccupancyPowerCheck"
        active: true
        min_power_watts: 0
      zero_sm_occupancy_power_invalid_report_limit:
        $class: "sarc.alerts.usage_alerts.zero_sm_occupancy_power:ZeroSmOccupancyPowerCheck"
        active: true
        report_limit: 0

      # same_job_id_* checks correspond to test params in test_alert_same_job_id.py
      same_job_id_default:
        $class: "sarc.alerts.usage_alerts.same_job_id:SameJobIdCheck"
        active: true
      same_job_id_all:
        $class: "sarc.alerts.usage_alerts.same_job_id:SameJobIdCheck"
        active: true
        since: null
        time_interval: null
      same_job_id_since_before:
        $class: "sarc.alerts.usage_alerts.same_job_id:SameJobIdCheck"
        active: true
        since: "2023-02-18T14:00+00:00"
        time_interval: null
      same_job_id_since_in:
        $class: "sarc.alerts.usage_alerts.same_job_id:SameJobIdCheck"
        active: true
        since: "2023-02-18T17:00+00:00"
        time_interval: null
      same_job_id_since_after_first:
        $class: "sarc.alerts.usage_alerts.same_job_id:SameJobIdCheck"
        active: true
        since: "2023-02-19T06:00+00:00"
        time_interval: null
      same_job_id_since_after_both:
        $class: "sarc.alerts.usage_alerts.same_job_id:SameJobIdCheck"
        active: true
        since: "2023-02-19T12:00+00:00"
        time_interval: null
      same_job_id_interval_before:
        $class: "sarc.alerts.usage_alerts.same_job_id:SameJobIdCheck"
        active: true
        since: "2023-02-18T02:00+00:00"
        time_interval: 3h
      same_job_id_interval_on_first:
        $class: "sarc.alerts.usage_alerts.same_job_id:SameJobIdCheck"
        active: true
        since: "2023-02-18T14:00+00:00"
        time_interval: 4h
      same_job_id_interval_on_both:
        $class: "sarc.alerts.usage_alerts.same_job_id:SameJobIdCheck"
        active: true
        since: "2023-02-18T14:00+00:00"
        time_interval: 10h
      same_job_id_interval_full:
        $class: "sarc.alerts.usage_alerts.same_job_id:SameJobIdCheck"
        active: true
        since: "2023-02-18T14:00+00:00"
        time_interval: 22h
      same_job_id_interval_after:
        $class: "sarc.alerts.usage_alerts.same_job_id:SameJobIdCheck"
        active: true
        since: "2023-02-19T12:00+00:00"
        time_interval: 22h
      same_job_id_time_interval_too_short:
        $class: "sarc.alerts.usage_alerts.same_job_id:SameJobIdCheck"
        active: true
        since: null
        time_interval: 275d
      same_job_id_time_interval_long_enough:
        $class: "sarc.alerts.usage_alerts.same_job_id:SameJobIdCheck"
        active: true
        since: null
        time_interval: 276d

      # old_running_jobs_* checks correspond to test params in test_alert_old_running_jobs.py
      #
      # In testing DB, there is 1 RUNNING job:
      #   job_id: 7
      #   cluster_name: raisin
      #   submit_time: ~2023-02-15T17:00:00+00:00
      #   start_time:  ~2023-02-15T17:01:00+00:00
      #   time_limit: 43200 (12 hours)
      #   max_end_time: ~2023-02-16T05:01:00+00:00
      # MOCK_TIME is 2023-11-22T00:00:00+00:00, so this job is over limit.

      # Check all RUNNING jobs (no `since` filter).
      # Should find the old RUNNING job => FAILURE.
      old_running_jobs_all:
        $class: "sarc.alerts.usage_alerts.old_running_jobs:OldRunningJobCheck"
        active: true
        since: null

      # `since` before the RUNNING job's submit_time.
      # Should find the old RUNNING job => FAILURE.
      old_running_jobs_since_before:
        $class: "sarc.alerts.usage_alerts.old_running_jobs:OldRunningJobCheck"
        active: true
        since: "2023-02-15T00:00+00:00"

      # `since` after the RUNNING job's submit_time.
      # Should NOT find the old RUNNING job => OK.
      old_running_jobs_since_after:
        $class: "sarc.alerts.usage_alerts.old_running_jobs:OldRunningJobCheck"
        active: true
        since: "2023-02-16T00:00+00:00"

      # temp_cache_file check corresponds to test params in test_temporary_cache_file.py
      temporary_cache_file:
        $class: "sarc.alerts.usage_alerts.temporary_cache_file:TemporaryCacheFileCheck"
        active: true

      # users_collection check corresponds to test params in test_alert_users_collection.py
      users_collection:
        $class: "sarc.alerts.usage_alerts.users_collection:UsersCollectionCheck"
        active: true

      # job_series_* checks correspond to tests in test_job_series_coherence.py.
      # The window is widened to cover the whole fixture.
      job_series_whole:
        $class: "sarc.alerts.usage_alerts.job_series_coherence:JobSeriesWholeCheck"
        active: true
      job_series_recent_365_days:
        $class: "sarc.alerts.usage_alerts.job_series_coherence:JobSeriesRecentCheck"
        active: true
        time_interval: 365d

      # harmonized_gpu_types_* checks correspond to test params in test_harmonized_gpu_types.py.
      #
      # GPU jobs (allocated_gres_gpu > 0) with a raw GPU name but no harmonized one in
      # the testing DB, after the test seeds raw GPU names on raisin's first jobs
      # (SEED in the test file):
      #   raisin  a100l (3), v100 (1)
      # raisin has 19 GPU jobs in all: 3 harmonized, and 12 with no allocated_gpu_type,
      # which the check ignores -- as it does fromage's and patate's single GPU jobs,
      # untyped too, and mila's only job, which has allocated_gres_gpu = 0.
      #
      # The fixture jobs are submitted in February 2023 and MOCK_TIME is November 2023,
      # so every check that has to see them opens the window wide.

      # Whole table: every cluster and raw GPU name above is reported.
      harmonized_gpu_types_all:
        $class: "sarc.alerts.usage_alerts.harmonized_gpu_types:HarmonizedGpuTypeCheck"
        active: true
        time_interval: null

      # Default 1-day window, which no fixture job falls into.
      harmonized_gpu_types_default:
        $class: "sarc.alerts.usage_alerts.harmonized_gpu_types:HarmonizedGpuTypeCheck"
        active: true

      # Wide enough window to hold every fixture job.
      harmonized_gpu_types_interval_365d:
        $class: "sarc.alerts.usage_alerts.harmonized_gpu_types:HarmonizedGpuTypeCheck"
        active: true
        time_interval: 365d

      # Restricted to some clusters, one of which has no GPU job and one of which
      # is not a configured cluster at all.
      harmonized_gpu_types_clusters:
        $class: "sarc.alerts.usage_alerts.harmonized_gpu_types:HarmonizedGpuTypeCheck"
        active: true
        time_interval: null
        cluster_names:
          - raisin
          - mila
          - invisible-cluster

      # A single example job per alert.
      harmonized_gpu_types_report_limit_1:
        $class: "sarc.alerts.usage_alerts.harmonized_gpu_types:HarmonizedGpuTypeCheck"
        active: true
        time_interval: null
        report_limit: 1

      # More examples than the smallest groups hold.
      harmonized_gpu_types_report_limit_20:
        $class: "sarc.alerts.usage_alerts.harmonized_gpu_types:HarmonizedGpuTypeCheck"
        active: true
        time_interval: null
        report_limit: 20

      # Empty window: rejected before any query.
      harmonized_gpu_types_invalid_interval:
        $class: "sarc.alerts.usage_alerts.harmonized_gpu_types:HarmonizedGpuTypeCheck"
        active: true
        time_interval: 0s

      # Nothing reported: rejected before any query.
      harmonized_gpu_types_invalid_report_limit:
        $class: "sarc.alerts.usage_alerts.harmonized_gpu_types:HarmonizedGpuTypeCheck"
        active: true
        report_limit: 0
